<style>
:root{--bleu:#262669;--violet:#7043ab}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;

.card{background:#fff;border-radius:16px;padding:2.4rem 2rem;max-width:26rem;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.35)}
.tag{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:var(--violet);font-weight:700;margin:0 0 .8rem}
h1{font-size:1.35rem;color:var(--bleu);margin:0 0 .5rem}
p.sub{color:#666;font-size:.92rem;margin:0 0 1.4rem}
input{width:100%;padding:.85rem 1rem;border:1.5px solid #ddd;border-radius:9px;font-size:1rem;margin-bottom:.8rem}
input:focus{outline:none;border-color:var(--violet)}
button{width:100%;padding:.85rem;border:0;border-radius:9px;background:linear-gradient(135deg,#262669,#7043ab);
  color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
button:hover{opacity:.92}
.err{color:#c0392b;font-size:.88rem;min-height:1.2rem;margin:.7rem 0 0}

</div>

function b64(s){var bin=atob(s),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
function derive(pwd){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey'])
    .then(function(km){return crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(SALT),iterations:200000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);});
}
function tryDecrypt(pwd){
  return derive(pwd).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NONCE)},key,b64(DATA));
  }).then(function(pt){return new TextDecoder().decode(pt);});
}
document.addEventListener('DOMContentLoaded',function(){
  var saved=sessionStorage.getItem('peplus_pwd');
  if(saved){tryDecrypt(saved).then(function(html){document.open();document.write(html);document.close();}).catch(function(){});}
  document.getElementById('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var pwd=document.getElementById('pwd').value;
    tryDecrypt(pwd).then(function(html){
      sessionStorage.setItem('peplus_pwd',pwd);
      document.open();document.write(html);document.close();
    }).catch(function(){document.getElementById('err').textContent='Mot de passe incorrect.';});
  });
});
