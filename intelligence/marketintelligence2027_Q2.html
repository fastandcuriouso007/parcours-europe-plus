:root{--stage:#12143a;--slide:#191b52;--indigo:#262669;--indigo2:#2e2e7a;--violet:#6666c9;
  --violet2:#5959d0;--purple:#7043ab;--purple2:#5b2785;--blue-l:#b2d1ff;--lav:#d6d6ff;
  --text-soft:#d8dbff;--muted:#9aa0e0;--f-display:'Sora',sans-serif;--f-mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--f-display);background:var(--stage);color:#fff;overflow-x:hidden;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
.g1{width:420px;height:420px;background:#7043ab;left:-120px;top:-140px}
.g2{width:520px;height:520px;background:#6666c9;right:-160px;bottom:-180px}
.g3{width:300px;height:300px;background:#5959d0;left:40%;top:55%}
.ring{position:absolute;border:2px solid rgba(214,214,255,.18);border-radius:50%;pointer-events:none}
.r1{width:460px;height:460px;right:130px;top:170px}
.r2{width:260px;height:260px;left:70px;top:-70px}
.topbar{position:absolute;top:26px;left:34px;right:34px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;color:#fff}
.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--purple))}
.tmeta{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-l)}
.stage{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 24px 40px;text-align:center}
.kicker{display:inline-flex;align-items:center;gap:14px;font-family:var(--f-mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue-l);margin-bottom:22px}
.kicker::before{content:"";width:40px;height:3px;background:linear-gradient(90deg,var(--violet),var(--purple))}
h1{font-weight:800;font-size:clamp(38px,6vw,64px);line-height:1.04;letter-spacing:-.03em;margin:0 0 12px}
.grad{background:linear-gradient(120deg,#b2d1ff 0%,#6666c9 45%,#c8a6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:var(--f-mono);font-size:13px;letter-spacing:.05em;color:var(--text-soft);margin:0 0 32px;line-height:1.8}
.card{width:min(400px,92vw);background:rgba(255,255,255,.06);border:1px solid rgba(214,214,255,.22);
  border-radius:16px;padding:1.9rem 1.7rem;backdrop-filter:blur(8px);text-align:left}
input{width:100%;padding:.9rem 1rem;border:1.5px solid rgba(214,214,255,.35);border-radius:10px;font-size:1rem;
  margin-bottom:.9rem;background:rgba(18,20,58,.55);color:#fff;font-family:var(--f-mono)}
input::placeholder{color:var(--muted)}
input:focus{outline:none;border-color:var(--violet);background:rgba(18,20,58,.8)}
button{width:100%;padding:.95rem;border:0;border-radius:10px;background:linear-gradient(135deg,var(--violet),var(--purple));
  color:#fff;font-size:1rem;font-weight:700;cursor:pointer;font-family:var(--f-display);letter-spacing:.02em}
button:hover{filter:brightness(1.12)}
.err{color:#ffb2b2;font-family:var(--f-mono);font-size:.85rem;min-height:1.3rem;margin:.8rem 0 0}
@media (max-width:640px){.tmeta{display:none}.ring{display:none}}

</div>

function b64(s){var bin=atob(s),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
function derive(pwd){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey'])
    .then(function(km){return crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(SALT),iterations:200000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);});
}
function tryDecrypt(pwd){
  return derive(pwd).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NONCE)},key,b64(DATA));
  }).then(function(pt){return new TextDecoder().decode(pt);});
}
document.addEventListener('DOMContentLoaded',function(){
  var saved=sessionStorage.getItem('peplus_pwd');
  if(saved){tryDecrypt(saved).then(function(html){document.open();document.write(html);document.close();}).catch(function(){});}
  document.getElementById('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var pwd=document.getElementById('pwd').value;
    tryDecrypt(pwd).then(function(html){
      sessionStorage.setItem('peplus_pwd',pwd);
      document.open();document.write(html);document.close();
    }).catch(function(){document.getElementById('err').textContent='Mot de passe incorrect / Wrong password.';});
  });
});
